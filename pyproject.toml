[project]
name = "mandate-kernel"
version = "0.1.0"
description = "Deterministic, LLM-free enforcement kernel for agent payments"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[project.scripts]
mk = "mk:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mk"]

[tool.setuptools.packages.find]
include = ["kernel*", "agent*", "sim*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
